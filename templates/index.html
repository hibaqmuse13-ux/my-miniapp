<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDTPilot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #12151c;
            color: #ffffff;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #1e232d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .balance-title { color: #8a94a6; font-size: 14px; }
        .balance-val { font-size: 28px; font-weight: bold; color: #28a745; margin-top: 4px; }
        .btn {
            background: #0088cc;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #12151c;
            color: white;
        }
        .plan-card {
            border: 1px solid #28a745;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="balance-title">Main Balance</div>
        <div class="balance-val" id="balance">$0.00 USDT</div>
        <div class="balance-title" style="margin-top: 8px;">Active Investments</div>
        <div id="active-deposit" style="font-size: 18px; font-weight: bold;">$0.00 USDT</div>
    </div>

    <div class="card">
        <h3>💳 Automated TRC20 Deposit</h3>
        <p style="font-size: 12px; color: #aaa;">Deposit Address:</p>
        <code style="color: #28a745; font-size: 11px;">TLPVBmQnS6VTV7MwzLzYy7EjUKqsKob7hs</code>
        <br><br>
        <input type="text" id="txid" placeholder="Enter Transaction Hash (TXID)">
        <button class="btn" onclick="verifyDeposit()">Verify TXID</button>
    </div>

    <div class="card">
        <h3>💎 7-Day Investment Plan</h3>
        <div class="plan-card">
            <h4>Starter Plan (20% Profit / 7 Days)</h4>
            <p>Payouts: Hourly</p>
            <button class="btn" onclick="invest(10)">Invest $10 USDT</button>
            <button class="btn" style="background: #28a745;" onclick="invest(50)">Invest $50 USDT</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || 7076265514; // Default fallback

        function loadUserData() {
            fetch(`/api/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('balance').innerText = `$${data.balance.toFixed(2)} USDT`;
                    document.getElementById('active-deposit').innerText = `$${data.active_deposit.toFixed(2)} USDT`;
                });
        }

        function verifyDeposit() {
            let txid = document.getElementById('txid').value;
            if(!txid) return alert('Please enter TXID!');

            fetch('/api/deposit/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, txid: txid })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadUserData();
            });
        }

        function invest(amount) {
            fetch('/api/invest', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadUserData();
            });
        }

        loadUserData();
    </script>
</body>
</html>
