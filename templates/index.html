<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDTPilot Exchange</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">


<!-- HEADER -->
<header>
    <div class="profile">
        <div class="avatar">U</div>
        <div>
            <h4 id="username">User</h4>
            <small id="userid">ID:---</small>
        </div>
    </div>

    <div class="verified">
        <i class="fa fa-check"></i>
    </div>
</header>


<!-- BALANCE CARD -->

<section class="balance-card">

<p>Total Balance</p>

<h1>
$<span id="balance">0.00</span>
</h1>

<div class="currency">
USDT Wallet
</div>


<div class="stats">

<div>
<h3 id="deposit">$0</h3>
<span>Deposit</span>
</div>


<div>
<h3>$0</h3>
<span>Profit</span>
</div>


<div>
<h3>24h</h3>
<span>Activity</span>
</div>

</div>

</section>



<!-- QUICK BUTTONS -->

<div class="quick">


<button onclick="openPage('exchange')">
<i class="fa fa-repeat"></i>
Exchange
</button>


<button onclick="openPage('deposit')">
<i class="fa fa-wallet"></i>
Deposit
</button>


<button onclick="openPage('withdraw')">
<i class="fa fa-arrow-up"></i>
Withdraw
</button>


<button onclick="openPage('history')">
<i class="fa fa-clock"></i>
History
</button>


</div>




<!-- CONTENT -->

<section id="home">


<div class="card">

<h3>
<i class="fa fa-bolt"></i>
Fast Exchange
</h3>

<p>
Buy and sell USDT instantly with secure transactions.
</p>


<button class="primary">
Start Exchange
</button>


</div>




<div class="card">

<h3>
<i class="fa fa-gift"></i>
Referral Program
</h3>

<p>
Invite friends and earn rewards.
</p>


<button class="secondary">
Invite Friends
</button>


</div>


</section>






<!-- BOTTOM NAV -->

<nav>


<button class="active">
<i class="fa fa-home"></i>
Home
</button>


<button>
<i class="fa fa-chart-line"></i>
Market
</button>


<button>
<i class="fa fa-wallet"></i>
Wallet
</button>


<button>
<i class="fa fa-user"></i>
Profile
</button>


</nav>



</div>



<script src="js/app.js"></script>

</body>
</html>
