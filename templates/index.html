<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDTPilot Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #0088cc;
            --success-color: #2ea043;
            --danger-color: #da3633;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 75px; }
        .container { padding: 16px; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-color); display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .hero-card {
            background: linear-gradient(135deg, #1f293d 0%, #111827 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .main-balance { font-size: 32px; font-weight: 800; color: #fff; margin: 6px 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }

        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0d1117; color: #fff; font-size: 14px; }

        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent-color); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-success { background: var(--success-color); }

        .plans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .plan-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; background: rgba(255,255,255,0.02); text-align: center; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); font-size: 11px; cursor: pointer; gap: 4px; }
        .nav-item.active { color: var(--accent-color); }

        /* Ledger Row */
        .ledger-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="avatar-initial">U</div>
                <div>
                    <div style="font-weight: bold; font-size: 14px;" id="username-display">User</div>
                    <div style="font-size: 11px; color: var(--text-sub);" id="userid-display">ID: ---</div>
                </div>
            </div>
            <span style="font-size: 11px; background: rgba(46,160,67,0.2); color: var(--success-color); padding: 4px 8px; border-radius: 12px;">Verified 🟢</span>
        </div>

        <!-- Hero Balance -->
        <div class="hero-card">
            <div style="font-size: 13px; color: var(--text-sub);">TOTAL PORTFOLIO BALANCE</div>
            <div class="main-balance" id="balance">$0.00 USDT</div>
            <div class="stats-grid">
                <div><span>Active Investments</span><div id="active-deposit" style="color: var(--success-color); font-weight:600;">$0.00</div></div>
                <div><span>Hourly Yield</span><div style="color: var(--accent-color); font-weight:600;">+20% / 7 Days</div></div>
            </div>
        </div>

        <!-- TAB 1: HOME -->
        <div id="tab-home" class="tab-content active">
            <div class="card">
                <h3><i class="fa-solid fa-rocket"></i> Quick Actions</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button class="btn" onclick="switchTab('deposit')"><i class="fa-solid fa-wallet"></i> Deposit</button>
                    <button class="btn btn-success" onclick="switchTab('withdraw')"><i class="fa-solid fa-paper-plane"></i> Withdraw</button>
                </div>
            </div>
        </div>

        <!-- TAB 2: DEPOSIT -->
        <div id="tab-deposit" class="tab-content">
            <div class="card">
                <h3><i class="fa-solid fa-qrcode"></i> Automated Deposit Verification</h3>
                <div class="form-group">
                    <label>Select Network</label>
                    <select id="network-select" onchange="updateDepositAddress()">
                        <option value="TRC20">USDT (TRC20)</option>
                        <option value="BEP20">USDT (BEP20 / BSC)</option>
                        <option value="ERC20">USDT (ERC20 / ETH)</option>
                        <option value="TON">TON (Toncoin)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Deposit Address</label>
                    <input type="text" id="deposit-address-display" value="TLPVBmQnS6VTV7MwzLzYy7EjUKqsKob7hs" readonly style="color: var(--success-color); font-weight:bold;">
                </div>
                <div class="form-group">
                    <label>Deposit Amount (USDT)</label>
                    <input type="number" id="deposit-amt" placeholder="e.g. 50">
                </div>
                <div class="form-group">
                    <label>Transaction TXID / Hash</label>
                    <input type="text" id="txid-input" placeholder="Paste Blockchain TXID">
                </div>
                <button class="btn" onclick="submitDeposit()">Submit Deposit for Verification</button>
            </div>
        </div>

        <!-- TAB 3: INVEST -->
        <div id="tab-invest" class="tab-content">
            <div class="card">
                <h3><i class="fa-solid fa-gem"></i> Choose Investment Plan</h3>
                <div class="plans-grid" id="plans-container"></div>
            </div>
        </div>

        <!-- TAB 4: HISTORY / LEDGER -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> Transaction History</h3>
                <div id="history-list"></div>
            </div>
        </div>

        <!-- TAB 5: WITHDRAW -->
        <div id="tab-withdraw" class="tab-content">
            <div class="card">
                <h3><i class="fa-solid fa-money-bill-transfer"></i> Cashout</h3>
                <div class="form-group"><label>Wallet Address</label><input type="text" placeholder="TRC20 / BEP20 Address"></div>
                <div class="form-group"><label>Amount (USDT)</label><input type="number" placeholder="Min $10"></div>
                <button class="btn btn-success" onclick="alert('Withdrawal request submitted!')">Request Payout</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item" onclick="switchTab('deposit')"><i class="fa-solid fa-wallet"></i><span>Deposit</span></div>
        <div class="nav-item" onclick="switchTab('invest')"><i class="fa-solid fa-chart-line"></i><span>Invest</span></div>
        <div class="nav-item" onclick="switchTab('history')"><i class="fa-solid fa-list"></i><span>Ledger</span></div>
        <div class="nav-item" onclick="switchTab('withdraw')"><i class="fa-solid fa-paper-plane"></i><span>Withdraw</span></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || 7076265514;
        let userName = tg.initDataUnsafe?.user?.first_name || "Ismail Essa";

        document.getElementById('username-display').innerText = userName;
        document.getElementById('userid-display').innerText = `ID: ${userId}`;
        document.getElementById('avatar-initial').innerText = userName.charAt(0).toUpperCase();

        const networkAddresses = {
            'TRC20': 'TLPVBmQnS6VTV7MwzLzYy7EjUKqsKob7hs',
            'BEP20': '0xe4484af8794b0fe2eccf433f7da7ac81935fc4a0',
            'ERC20': '0xe4484af8794b0fe2eccf433f7da7ac81935fc4a0',
            'TON': 'UQBGo3k-EhMubMv4h3RqHszdcJdqoxttvZnuwDvPHbk8jl6P'
        };

        function updateDepositAddress() {
            let net = document.getElementById('network-select').value;
            document.getElementById('deposit-address-display').value = networkAddresses[net];
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            const navs = ['home', 'deposit', 'invest', 'history', 'withdraw'];
            const idx = navs.indexOf(tabName);
            if(idx !== -1) document.querySelectorAll('.nav-item')[idx].classList.add('active');
        }

        function renderInvestmentPlans() {
            const container = document.getElementById('plans-container');
            container.innerHTML = '';
            for(let amount = 10; amount <= 100; amount += 10) {
                container.innerHTML += `
                    <div class="plan-card">
                        <h4 style="color:var(--accent-color);">$${amount} USDT</h4>
                        <div style="font-size:12px; color:var(--success-color); margin: 6px 0;">+20% / 7 Days</div>
                        <button class="btn" style="padding:6px; font-size:12px;" onclick="investPlan(${amount})">Invest $${amount}</button>
                    </div>
                `;
            }
        }

        function loadAccountData() {
            fetch(`/api/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('balance').innerText = `$${data.balance.toFixed(2)} USDT`;
                    document.getElementById('active-deposit').innerText = `$${data.active_deposit.toFixed(2)} USDT`;

                    let historyHTML = '';
                    if(data.history.length === 0) {
                        historyHTML = '<p style="font-size:12px; color:var(--text-sub);">No transactions recorded yet.</p>';
                    } else {
                        data.history.forEach(tx => {
                            historyHTML += `
                                <div class="ledger-row">
                                    <div><strong>${tx.type}</strong><br><small style="color:var(--text-sub);">${tx.date}</small></div>
                                    <div style="text-align:right;"><strong>${tx.amount}</strong><br><span style="color:var(--success-color); font-size:11px;">${tx.status}</span></div>
                                </div>
                            `;
                        });
                    }
                    document.getElementById('history-list').innerHTML = historyHTML;
                });
        }

        function submitDeposit() {
            let txid = document.getElementById('txid-input').value.trim();
            let amount = document.getElementById('deposit-amt').value;
            let network = document.getElementById('network-select').value;

            if(!txid || !amount) return alert('Please enter both TXID and Amount!');

            fetch('/api/deposit/request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, username: userName, network: network, txid: txid, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                document.getElementById('txid-input').value = '';
                document.getElementById('deposit-amt').value = '';
            });
        }

        function investPlan(amt) {
            fetch('/api/invest', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, amount: amt })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadAccountData();
            });
        }

        renderInvestmentPlans();
        loadAccountData();
        setInterval(loadAccountData, 5000); // Live balance polling every 5 seconds
    </script>
</body>
</html>
